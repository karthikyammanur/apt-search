<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111}a:hover{color:#1F4FD1}
</style>
</helmet>
<div style="min-height: 1240px; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #111111">

<header style="max-width: 760px; margin: 0 auto; padding: 20px 24px 0; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px">
<a href="Main.dc.html" style="font-size: 16px; font-weight: 600; text-decoration: none; padding: 12px 0">Apartment finder</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 24px">
<a href="Main.dc.html" style="font-size: 15px; padding: 12px 0; color: #6B6E76; text-decoration: none">Listings</a>
<a href="Chat.dc.html" style="font-size: 15px; padding: 12px 0; color: #6B6E76; text-decoration: none">Chat</a>
<a href="Leads.dc.html" style="font-size: 15px; padding: 12px 0; color: #6B6E76; text-decoration: none">Sources</a>
<a href="Settings.dc.html" aria-current="page" style="font-size: 15px; padding: 12px 0; text-decoration: underline; text-underline-offset: 6px">Settings</a>
</nav>
</header>

<main style="max-width: 760px; margin: 0 auto; padding: 48px 24px 64px; box-sizing: border-box">

<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em">Settings</h1>
<p style="margin: 8px 0 0; font-size: 15px; color: #6B6E76">Saving re-checks every listing.</p>

<form style="margin-top: 32px; display: flex; flex-direction: column; font-size: 15px">

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 14px 0; border-top: 1px solid #ECECEC"><label for="office">Office</label><input id="office" type="text" value="Your office, Palo Alto" style="flex: 0 1 320px; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #DDDDDA; font: 15px Inter, sans-serif; color: #111111"></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 14px 0; border-top: 1px solid #ECECEC"><label for="arrive">Arrive by</label><input id="arrive" type="text" value="8:30 am" style="flex: 0 1 320px; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #DDDDDA; font: 15px Inter, sans-serif; color: #111111"></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 14px 0; border-top: 1px solid #ECECEC"><label for="cap">Most you'll pay, all-in</label><input id="cap" type="text" value="$2,500" style="flex: 0 1 320px; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #DDDDDA; font: 15px Inter, sans-serif; color: #111111"></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 14px 0; border-top: 1px solid #ECECEC"><label for="target">Hoping to pay</label><input id="target" type="text" value="$1,600" style="flex: 0 1 320px; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #DDDDDA; font: 15px Inter, sans-serif; color: #111111"></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 14px 0; border-top: 1px solid #ECECEC"><label for="dates">Dates</label><input id="dates" type="text" value="Move in Jan 2 to 8, out Aug 13" style="flex: 0 1 320px; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #DDDDDA; font: 15px Inter, sans-serif; color: #111111"></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 14px 0; border-top: 1px solid #ECECEC"><label for="commute">Longest commute</label><input id="commute" type="text" value="30 min, stop within 10 min walk" style="flex: 0 1 320px; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #DDDDDA; font: 15px Inter, sans-serif; color: #111111"></div>

<fieldset style="margin: 0; padding: 14px 0; border: 0; border-top: 1px solid #ECECEC">
<legend style="float: left; padding: 0 0 6px">Must have</legend>
<div style="clear: both; display: flex; flex-wrap: wrap; gap: 0 28px">
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #111111">Private bedroom</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #111111">Private bathroom</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #111111">Furnished</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #111111">Meet roommates on video first</label>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 14px 0; border: 0; border-top: 1px solid #ECECEC; border-bottom: 1px solid #ECECEC">
<legend style="float: left; padding: 0 0 10px">How much each matters</legend>
<div style="clear: both; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 16px"><label for="w1" style="width: 90px">Cafes</label><input id="w1" type="range" min="0" max="10" value="7" style="flex: 1 1 auto; min-height: 44px; accent-color: #111111"></div>
<div style="display: flex; align-items: center; gap: 16px"><label for="w2" style="width: 90px">Grocery</label><input id="w2" type="range" min="0" max="10" value="6" style="flex: 1 1 auto; min-height: 44px; accent-color: #111111"></div>
<div style="display: flex; align-items: center; gap: 16px"><label for="w3" style="width: 90px">Gym</label><input id="w3" type="range" min="0" max="10" value="3" style="flex: 1 1 auto; min-height: 44px; accent-color: #111111"></div>
</div>
</fieldset>

<button type="submit" style="margin-top: 32px; align-self: flex-start; min-height: 48px; padding: 0 24px; border-radius: 10px; border: 0; background: #111111; font: 500 15px Inter, sans-serif; color: #FFFFFF; cursor: pointer">Save</button>
</form>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
