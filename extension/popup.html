<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Apartment finder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="popup">
    <strong>Apartment finder</strong>
    <div>
      <div id="page-name">Current page</div>
      <p id="count">Checking visible content</p>
    </div>
    <button id="capture" disabled>Capture this page</button
    ><button id="capture-page" class="plain" hidden>Capture this page</button>
    <p id="status" role="status">Nothing captured yet.</p>
    <button id="options" class="plain">Options</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
